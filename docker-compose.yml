services:
  postgres:
    image: postgres:16-alpine
    container_name: hangar-postgres
    environment:
      POSTGRES_DB: hangar_db
      POSTGRES_USER: hangar_user
      POSTGRES_PASSWORD: hangar_dev_password
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Project 1 (CRM) đã chiếm 5435 trên máy dev này — map Hangar ra cổng khác để chạy song
      # song được cả 2 project cùng lúc.
      - "5436:5432"
    volumes:
      - hangar-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hangar_user -d hangar_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailhog:
    image: mailhog/mailhog
    container_name: hangar-mailhog
    ports:
      - "1026:1025" # SMTP — app gửi mail tới đây
      - "8026:8025" # Web UI + REST API xem mail đã "gửi" (http://localhost:8026)
    restart: unless-stopped

  minio:
    # minio/minio đã bị gỡ khỏi Docker Hub, và bản mirror ở quay.io cũng chặn pull ẩn danh từ
    # 24/9/2026 — dùng image thay thế chính thức từ Chainguard (nhà cung cấp image bảo mật uy
    # tín), tránh kéo các fork không rõ nguồn gốc. Image này chạy non-root (UID 65532) nên
    # volume data phải chown trước (xem README) và không có curl/wget/mc nên bỏ healthcheck.
    image: cgr.dev/chainguard/minio:latest
    container_name: hangar-minio
    ports:
      - "9002:9000" # API — lệch cổng mặc định 9000 để tránh đụng phần mềm khác trên máy dev
      - "9003:9001" # Console UI
    environment:
      MINIO_ROOT_USER: hangar
      MINIO_ROOT_PASSWORD: hangar123456 # dev only — không dùng giá trị này ở production
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data


  # Service "api" sẽ bật ở tuần cuối (tương tự Ngày 21 của CRM), build từ docker/Dockerfile,
  # cùng network với postgres.

volumes:
  hangar-postgres-data:
    name: hangar-postgres-data
  minio-data:
    name: minio-data
